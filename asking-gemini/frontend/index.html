<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ask Gemini</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Ask Gemini 🤖</h1>

      <p>Ask anything and get an AI-powered answer.</p>

      <form id="form">
        <input
          type="text"
          id="question"
          placeholder="Ask your question..."
          autocomplete="off"
        />

        <button type="submit" id="submitBtn">Ask Gemini</button>
      </form>

      <div id="loading"></div>

      <div id="error"></div>

      <div id="answer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
